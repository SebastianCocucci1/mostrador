# Prueba el codigo, arma el paquete para Windows y lo publica como Release
# cada vez que se sube un cambio a la rama main.
#
# El programa corre con el Python oficial embebido (pythonw.exe, firmado por la
# Python Software Foundation). No hay un .exe propio: asi los antivirus no lo
# confunden con algo peligroso.
#
# El release trae:
#   Mostrador.zip                    todo, para la primera instalacion
#   Mostrador-app.zip (+ .sha256)    solo el codigo: lo que baja el actualizador
#   Mostrador-lib.zip (+ .sha256)    las librerias: el actualizador las baja solo si cambiaron
name: Generar paquete

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-paquete
  cancel-in-progress: false

env:
  PYTHON_EMBEBIDO: "3.12.10"

jobs:
  generar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # el mismo Python que el embebido: las librerias compiladas (Pillow...) tienen que servirle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Poner numero de version
        shell: pwsh
        run: |
          $v = "1.${{ github.run_number }}"
          $ruta = "mostrador/__init__.py"
          $codigo = Get-Content $ruta -Raw -Encoding utf8
          $codigo = $codigo -replace 'VERSION = "[^"]*"', "VERSION = `"$v`""
          Set-Content $ruta $codigo -Encoding utf8 -NoNewline
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Armar el paquete
        shell: pwsh
        run: ./scripts/armar_paquete.ps1 -PythonVersion $env:PYTHON_EMBEBIDO

      - name: Probar que arranca con el Python embebido
        shell: pwsh
        run: |
          $archivo = Join-Path $env:RUNNER_TEMP 'version.txt'
          & dist\Mostrador\python\python.exe dist\Mostrador\app\Mostrador.pyw --escribir-version $archivo
          if ($LASTEXITCODE -ne 0) { throw "No arranca (codigo $LASTEXITCODE)" }
          $salida = Get-Content $archivo -Raw
          if ($salida -ne $env:VERSION) { throw "Version incorrecta: $salida" }
          Write-Output "Version: $salida"

      - name: Probar instalacion y actualizacion automatica
        shell: pwsh
        run: ./tests/probar_actualizacion.ps1

      - name: Publicar version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Version ${{ env.VERSION }}
          body: |
            Generado desde el commit ${{ github.sha }}.

            Primera instalacion: descargar Mostrador.zip, descomprimirlo en C:\ y abrir "Abrir Mostrador" (ver LEEME.txt adentro).
            Las instalaciones existentes se actualizan solas.
          files: |
            dist/Mostrador.zip
            dist/Mostrador-app.zip
            dist/Mostrador-app.zip.sha256
            dist/Mostrador-lib.zip
            dist/Mostrador-lib.zip.sha256
          make_latest: true
